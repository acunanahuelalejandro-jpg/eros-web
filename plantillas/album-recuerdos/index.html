<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f5">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f4b8c1'/%3E%3Cpath d='M32 49S12 37 12 24c0-10 13-14 20-4 7-10 20-6 20 4 0 13-20 25-20 25Z' fill='%23fffaf6'/%3E%3C/svg%3E">
  <title>Álbum de recuerdos | Eros Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:light;--cream:#fff8f5;--paper:#fffdfb;--pink:#f4b8c1;--pink-pale:#ffe9eb;--blue:#dcecf5;--blue-deep:#315b70;--wine:#8b3d52;--wine-rgb:139,61,82;--ink:#302b31;--muted:#665f67;--line:#eadfe0;--shadow:0 18px 50px rgba(75,48,57,.12);--heart-color:#a9445d;--button-ink:#fff;--theme-background:radial-gradient(ellipse at 18% 12%,#ffe7e8 0,transparent 36%),radial-gradient(ellipse at 90% 86%,#e3f1f7 0,transparent 34%),#fff8f5
    }
    *,*::before,*::after{box-sizing:border-box}
    [hidden]{display:none!important}
    html{min-width:320px;scroll-behavior:smooth}
    body{position:relative;margin:0;min-width:320px;min-height:100vh;color:var(--ink);background:var(--theme-background);font-family:"DM Sans",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
    body.playing{height:100svh;overflow:hidden;overscroll-behavior:none}
    button{font:inherit}
    img,svg,canvas{display:block;max-width:100%}
    :focus-visible{outline:3px solid #215f7b;outline-offset:4px}
    main{position:relative;z-index:1}
    .screen{min-height:100svh}
    .button{display:inline-flex;min-width:190px;min-height:58px;align-items:center;justify-content:center;gap:9px;padding:14px 23px;border:0;border-radius:999px;color:var(--button-ink);background:var(--wine);box-shadow:0 9px 22px rgba(75,48,57,.16);font-weight:700;text-align:center;cursor:pointer;transition:transform .2s ease,filter .2s ease}
    .button:hover{transform:translateY(-2px);filter:brightness(.95)}
    .intro-screen{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;padding:max(28px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom));text-align:center}
    .intro-content{width:min(100%,560px);margin:auto}
    .intro-heart{display:grid;width:78px;height:78px;place-items:center;margin:0 auto 19px;border:1px solid rgba(var(--wine-rgb),.13);border-radius:28px;color:var(--wine);background:var(--paper);box-shadow:var(--shadow);font-size:2.45rem}
    .intro-title{margin:0 auto 25px;color:var(--wine);font-family:"Playfair Display",Georgia,serif;font-size:clamp(2rem,8vw,3.25rem);font-weight:600;line-height:1.13}
    .game-screen{position:relative;z-index:3;display:grid;min-height:100svh;place-items:center;padding:24px 16px}
    .game-layout{width:min(100%,680px);padding:clamp(20px,5vw,34px);border:1px solid var(--line);border-radius:25px;background:var(--paper);box-shadow:var(--shadow);text-align:center}
    .game-recipient{margin:0 0 5px;color:var(--blue-deep);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    .game-prompt{margin:0 auto 14px;color:var(--wine);font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.45rem,5.6vw,2.15rem);line-height:1.2}
    .game-stage{width:min(100%,560px);margin:0 auto;touch-action:none}
    .game-status{min-height:28px;margin:10px 0 0;color:var(--muted);font-size:.92rem}
    .rescue-button{min-height:48px;margin:12px auto 0;padding:9px 16px;border:1px solid rgba(var(--wine-rgb),.24);border-radius:999px;color:var(--wine);background:var(--paper);font-size:.9rem;font-weight:700;cursor:pointer}
    .paint-canvas,.maze-canvas{width:min(100%,520px);height:auto;margin:auto;aspect-ratio:1;border-radius:20px;background:linear-gradient(145deg,var(--pink-pale),var(--blue));touch-action:none}
    .paint-progress{width:min(100%,360px);margin:10px auto 0;text-align:left}
    .paint-progress-label{display:block;margin-bottom:5px;color:var(--muted);font-size:.78rem;font-weight:700}
    .paint-progress-track{height:11px;overflow:hidden;border-radius:999px;background:var(--line)}
    .paint-progress-fill{width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pink),var(--wine));transform:scaleX(0);transform-origin:left center;transition:transform .18s ease}
    .flower-verdict{margin:0 0 3px;color:var(--wine);font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.8rem,8vw,2.6rem);font-weight:600}
    .flower-stage{position:relative;width:min(82vw,410px);margin:0 auto;aspect-ratio:1;touch-action:manipulation}
    .flower-petal{position:absolute;display:grid;width:clamp(31px,10vw,50px);height:clamp(52px,17vw,76px);place-items:center;padding:0;border:1px solid rgba(139,61,82,.22);border-radius:50% 50% 44% 44%;background:linear-gradient(135deg,#fff,#ffe7a5);box-shadow:0 4px 12px rgba(75,48,57,.1);cursor:pointer;transform:translate(-50%,-50%) rotate(var(--angle));transform-origin:center}
    .flower-petal.is-picked{pointer-events:none;animation:petal-fall .72s ease-in forwards}
    .flower-center{position:absolute;z-index:2;top:50%;left:50%;display:grid;width:clamp(72px,22vw,100px);aspect-ratio:1;place-items:center;border:2px solid rgba(139,61,82,.16);border-radius:50%;color:#fffdf2;background:radial-gradient(circle at 35% 30%,#ffe9a8,#eaa642 72%);box-shadow:0 5px 14px rgba(75,48,57,.12);font-size:2rem;transform:translate(-50%,-50%)}
    .flower-progress{margin:2px 0 0;color:var(--muted);font-size:.88rem}
    .maze-help{margin:6px 0 0;color:var(--muted);font-size:.82rem}
    .envelope-screen{position:relative;z-index:3}
    .content-screen{position:relative;z-index:2;min-height:100svh;padding:72px 14px 20px;opacity:0;transition:opacity .65s ease}
    .content-screen.is-opening{transition:none}
    .content-screen.is-open{opacity:1}
    .album-card{position:relative;z-index:2;width:min(100%,780px);margin:0 auto;padding:clamp(22px,5vw,52px);overflow:hidden;border:1px solid rgba(var(--wine-rgb),.13);border-radius:30px;background:var(--paper);background:color-mix(in srgb,var(--paper) 97%,transparent);box-shadow:var(--shadow)}
    .album-header{max-width:620px;margin:0 auto 20px;text-align:center}
    .album-title:focus{outline:none}
    .album-title{margin:0 0 10px;color:var(--wine);font-family:"Playfair Display",Georgia,serif;font-size:clamp(2.15rem,8vw,3.8rem);font-weight:600;letter-spacing:-.035em;line-height:1.08}
    .album-subtitle{margin:0;color:var(--muted);font-size:clamp(1rem,2.5vw,1.13rem)}
    .together-counter{max-width:510px;margin:23px auto 0;text-align:center}
    .album-controls{position:fixed;z-index:30;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:8px}
    .music-toggle,.auto-toggle{display:inline-flex;min-height:46px;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border:1px solid rgba(var(--wine-rgb),.18);border-radius:999px;color:var(--wine);background:var(--paper);box-shadow:0 7px 20px rgba(75,48,57,.12);font-size:.85rem;font-weight:700;cursor:pointer}
    .galaxy-stars{position:fixed;z-index:0;inset:0;pointer-events:none;opacity:.42;background-image:radial-gradient(1px 1px at 12% 24%,#fff 98%,transparent),radial-gradient(1.5px 1.5px at 76% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 62% 72%,#fff 98%,transparent),radial-gradient(1px 1px at 28% 82%,#fff 98%,transparent);background-size:190px 170px;animation:star-shimmer 12s ease-in-out infinite alternate}
    .ambient-hearts{position:fixed;z-index:0;inset:0;overflow:hidden;pointer-events:none}
    .ambient-heart{position:absolute;top:-42px;left:var(--x);color:var(--heart-color,var(--wine));font-size:var(--size);line-height:1;opacity:0;animation:heart-rain var(--duration) linear var(--delay) infinite;will-change:transform}
    .tap-heart-layer{position:fixed;z-index:12;inset:0;overflow:hidden;pointer-events:none}
    .tap-heart{position:fixed;color:var(--heart-color);font-size:28px;line-height:1;text-shadow:0 2px 9px rgba(var(--wine-rgb),.2);animation:tap-pop .95s ease-out both}
    .album-stage-wrap{width:min(100%,480px);margin:22px auto 0}
    .album-stage{position:relative;width:min(100%,440px);height:min(117vw,62svh,570px);min-height:300px;margin:0 auto;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
    .polaroid{position:absolute;inset:0;width:100%;height:100%;padding:11px 11px 36px;border:1px solid rgba(var(--wine-rgb),.17);border-radius:9px;background:linear-gradient(145deg,var(--pink-pale),var(--blue) 53%,var(--paper));box-shadow:0 15px 34px rgba(42,34,39,.2);cursor:zoom-in;transform-origin:50% 75%;transition:transform .36s cubic-bezier(.2,.75,.24,1),opacity .3s ease;overflow:hidden}
    .polaroid::after{content:"";position:absolute;inset:11px 11px 36px;pointer-events:none;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(var(--wine-rgb),.08)}
    .polaroid-image{width:100%;height:100%;border-radius:3px;background:linear-gradient(145deg,var(--pink-pale),var(--blue));object-fit:contain;pointer-events:none}
    .photo-placeholder{position:absolute;inset:11px 11px 36px;display:grid;place-items:center;padding:20px;border-radius:3px;color:var(--muted);background:linear-gradient(145deg,var(--pink-pale),var(--blue));font-size:.95rem;text-align:center}
    .stack-card{cursor:grab}
    .stack-card:active{cursor:grabbing}
    .stack-card.is-front{z-index:5}
    .stack-card.is-back-1{z-index:4;transform:translate(8px,9px) rotate(3deg) scale(.985)}
    .stack-card.is-back-2{z-index:3;transform:translate(-8px,17px) rotate(-3.3deg) scale(.97)}
    .stack-card.is-back-3{z-index:2;transform:translate(12px,24px) rotate(5deg) scale(.955)}
    .stack-card.is-leaving{opacity:0;transform:translate(var(--fly-x),-18px) rotate(var(--fly-turn)) scale(.9);transition:transform .42s cubic-bezier(.16,.72,.25,1),opacity .32s ease}
    .empty-message{margin:24px auto;color:var(--muted);text-align:center}
    .album-caption{max-width:620px;min-height:58px;margin:14px auto 0;color:var(--ink);font-size:1.04rem;text-align:center}
    .album-status{margin:5px 0 0;color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums;text-align:center}
    .album-nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:17px auto 0}
    .nav-button,.gallery-button{display:inline-flex;min-width:48px;min-height:48px;align-items:center;justify-content:center;gap:7px;padding:10px 15px;border:1px solid rgba(var(--wine-rgb),.23);border-radius:999px;color:var(--wine);background:var(--paper);font-weight:700;cursor:pointer}
    .nav-button.primary{color:var(--button-ink);background:var(--wine)}
    .nav-button:disabled{opacity:.43;cursor:not-allowed}
    .nav-button span[aria-hidden=true]{font-size:1.25rem;line-height:1}
    .auto-control{display:flex;justify-content:center;margin:12px auto 0}
    .album-closing{max-width:620px;margin:28px auto 0;padding:24px 14px 8px;border-top:1px solid var(--line);text-align:center;animation:closing-in .65s ease both}
    .closing-message{margin:0 auto 10px;color:var(--ink);font-size:clamp(1rem,2.5vw,1.12rem)}
    .closing-heart{display:inline-block;color:var(--wine);font-size:3.2rem;line-height:1.1;animation:heartbeat 1.7s ease-in-out infinite}
    .signature{margin:6px 0 0;color:var(--wine);font-family:"Playfair Display",Georgia,serif;font-size:1.5rem}
    .site-footer{position:relative;z-index:2;padding:16px 0 max(16px,env(safe-area-inset-bottom));color:var(--muted);font-size:.86rem;text-align:center}
    .dialog{width:min(94vw,980px);max-width:none;max-height:92svh;padding:12px;overflow:auto;border:1px solid rgba(255,255,255,.48);border-radius:20px;color:var(--ink);background:var(--paper);box-shadow:0 24px 90px rgba(20,14,17,.38)}
    .dialog::backdrop{background:rgba(35,26,31,.82);backdrop-filter:blur(4px)}
    .dialog-header{position:sticky;z-index:3;top:-12px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-12px -12px 12px;padding:12px;background:var(--paper)}
    .dialog-title{margin:0;color:var(--wine);font-family:"Playfair Display",Georgia,serif;font-size:1.5rem}
    .dialog-close{display:grid;flex:0 0 46px;width:46px;height:46px;place-items:center;border:0;border-radius:50%;color:var(--button-ink);background:var(--wine);font-size:1.7rem;line-height:1;cursor:pointer}
    .gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .gallery-thumb{position:relative;min-width:0;padding:7px 7px 9px;border:1px solid rgba(var(--wine-rgb),.16);border-radius:8px;background:linear-gradient(145deg,var(--pink-pale),var(--blue));box-shadow:0 5px 14px rgba(42,34,39,.12);cursor:zoom-in}
    .gallery-thumb[aria-current=true]{outline:3px solid var(--wine);outline-offset:2px}
    .gallery-thumb img{width:100%;aspect-ratio:1/1.08;border-radius:3px;background:linear-gradient(145deg,var(--pink-pale),var(--blue));object-fit:cover}
    .gallery-thumb span{display:block;padding-top:5px;color:var(--muted);font-size:.78rem;text-align:center}
    .lightbox-dialog{position:fixed;z-index:1000;width:min(96vw,1200px);max-height:94svh;padding:10px;overflow:visible}
    .lightbox-dialog img{width:100%;max-height:calc(94svh - 20px);border-radius:12px;object-fit:contain;cursor:zoom-out}
    .lightbox-close{position:absolute;z-index:2;top:-13px;right:-8px}
    .confetti-canvas{position:fixed;z-index:50;inset:0;width:100%;height:100%;pointer-events:none}
    .reveal{opacity:0;transform:translateY(14px);transition:opacity .65s ease,transform .65s ease}
    .reveal.is-visible{opacity:1;transform:translateY(0)}
    @keyframes star-shimmer{from{opacity:.22;transform:translateY(0)}to{opacity:.48;transform:translateY(-8px)}}
    @keyframes heart-rain{0%{opacity:0;transform:translate3d(0,-6vh,0) rotate(-8deg)}8%{opacity:var(--alpha);transform:translate3d(0,0,0) rotate(-4deg)}50%{opacity:var(--alpha);transform:translate3d(var(--mid-sway),52vh,0) rotate(var(--turn))}92%{opacity:var(--alpha)}100%{opacity:0;transform:translate3d(var(--sway),110vh,0) rotate(var(--turn))}}
    @keyframes tap-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}22%{opacity:1;transform:translate(-50%,-65%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-130%) scale(.8)}}
    @keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(1)}36%{transform:scale(1.08)}52%{transform:scale(1)}}
    @keyframes closing-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes petal-fall{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle))}100%{opacity:0;transform:translate(calc(-50% + var(--fall-x)),calc(-50% + 120px)) rotate(calc(var(--angle) + 130deg))}}
    @media(min-width:600px){.content-screen{padding:40px 22px 26px}.album-card{padding:clamp(36px,6vw,56px)}.album-stage{height:min(70vw,68svh,590px)}.gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.album-controls{right:18px;top:18px}}
    @media(min-width:1000px){.content-screen{padding-top:50px}.album-card{width:min(100%,820px)}.album-stage-wrap{margin-top:28px}.album-stage{width:min(100%,470px);height:min(560px,66svh)}}
    @media(max-width:400px){.content-screen{padding:76px 9px 18px}.album-card{padding:20px 14px;border-radius:23px}.album-stage{height:min(118vw,58svh);min-height:270px}.polaroid{padding:8px 8px 31px}.polaroid::after,.photo-placeholder{inset:8px 8px 31px}.album-controls{right:8px}.music-toggle,.auto-toggle{min-height:42px;padding:7px 10px;font-size:.8rem}.album-nav{gap:7px}.nav-button,.gallery-button{min-height:47px;padding:9px 12px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.button,.content-screen,.reveal,.polaroid,.album-closing,.paint-progress-fill{transition-duration:.01ms!important}.ambient-heart{animation-duration:60s!important;opacity:.18}.galaxy-stars{animation:none!important;opacity:.25}.closing-heart{animation:none}.stack-card.is-leaving{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main>
    <section class="screen intro-screen" id="introScreen" aria-labelledby="introTitle">
      <div class="intro-content">
        <div class="intro-heart" aria-hidden="true">♡</div>
        <h1 class="intro-title" id="introTitle">Un regalo para vos</h1>
        <button class="button" id="startButton" type="button">Tocá para empezar</button>
      </div>
    </section>

    <section class="screen game-screen" id="gameScreen" aria-labelledby="gamePrompt" hidden>
      <div class="game-layout">
        <p class="game-recipient" id="gameRecipient" hidden></p>
        <h1 class="game-prompt" id="gamePrompt" tabindex="-1"></h1>
        <div class="game-stage" id="gameStage" aria-label="Juego interactivo"></div>
        <p class="game-status" id="gameStatus" role="status" aria-live="polite"></p>
        <button class="rescue-button" id="rescueButton" type="button" hidden>Seguir al álbum</button>
      </div>
    </section>

    <section class="screen envelope-screen" id="envelopeScreen" hidden></section>

    <section class="content-screen" id="contentScreen" aria-labelledby="albumTitle" hidden>
      <div class="ambient-hearts" id="ambientHearts" aria-hidden="true"></div>
      <div class="tap-heart-layer" id="tapHeartLayer" aria-hidden="true"></div>
      <div class="album-controls">
        <button class="music-toggle" id="musicToggle" type="button" hidden>
          <span aria-hidden="true">♫</span><span id="musicText">Pausar música</span>
        </button>
      </div>
      <audio id="backgroundMusic" preload="none" loop></audio>

      <article class="album-card">
        <header class="album-header">
          <h1 class="album-title reveal" id="albumTitle" tabindex="-1"></h1>
          <p class="album-subtitle reveal" id="albumSubtitle"></p>
          <section class="together-counter reveal" id="togetherCounter" aria-label="Tiempo juntos" hidden></section>
        </header>

        <section class="album-view" id="albumView" aria-label="Álbum de fotos">
          <div class="album-stage-wrap">
            <div class="album-stage" id="albumStage" role="group" aria-label="Foto actual. Deslizá a los costados para cambiar de foto."></div>
          </div>
          <p class="album-caption reveal" id="albumCaption" aria-live="polite"></p>
          <p class="album-status" id="albumStatus" aria-live="polite"></p>
          <nav class="album-nav" aria-label="Controles del álbum">
            <button class="nav-button" id="previousButton" type="button" aria-label="Foto anterior"><span aria-hidden="true">←</span><span>Anterior</span></button>
            <button class="nav-button primary" id="nextButton" type="button" aria-label="Foto siguiente"><span>Siguiente</span><span aria-hidden="true">→</span></button>
            <button class="gallery-button" id="galleryButton" type="button">Ver todas</button>
          </nav>
          <div class="auto-control" id="autoControl" hidden>
            <button class="auto-toggle" id="autoToggle" type="button" aria-pressed="false">Pausar avance</button>
          </div>
        </section>
        <p class="empty-message" id="emptyMessage" hidden>Este álbum todavía no tiene fotos.</p>

        <section class="album-closing" id="albumClosing" aria-live="polite" hidden>
          <p class="closing-message" id="closingMessage"></p>
          <span class="closing-heart" aria-hidden="true">♥</span>
          <p class="signature" id="signature"></p>
        </section>
      </article>
      <footer class="site-footer" id="siteFooter">Eros Web</footer>
    </section>
  </main>

  <dialog class="dialog gallery-dialog" id="galleryDialog" aria-labelledby="galleryTitle">
    <div class="dialog-header">
      <h2 class="dialog-title" id="galleryTitle">Todas las fotos</h2>
      <button class="dialog-close" id="closeGallery" type="button" aria-label="Cerrar galería">×</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </dialog>

  <dialog class="dialog lightbox-dialog" id="photoDialog" aria-label="Foto ampliada">
    <button class="dialog-close lightbox-close" id="closePhoto" type="button" aria-label="Cerrar foto">×</button>
    <img id="lightboxImage" alt="">
  </dialog>

  <canvas class="confetti-canvas" id="effectsCanvas" aria-hidden="true" hidden></canvas>

  <!-- El archivo editable del pedido se carga antes de los módulos compartidos. -->
  <script src="datos.js"></script>
  <script src="../../compartido/temas.js"></script>
  <script src="../../compartido/sobre.js"></script>
  <script src="../../compartido/contador.js"></script>
  <!-- Juegos, efectos y música reutilizan el núcleo común ya existente. -->
  <script src="../../plantillas/juegos-interactivos/nucleo/efectos.js"></script>
  <script src="../../plantillas/juegos-interactivos/nucleo/musica.js"></script>
  <script>
    (() => {
      "use strict";
      const data = window.DATOS && typeof window.DATOS === "object" ? window.DATOS : {};
      const cleanText = (value) => typeof value === "string" ? value.trim() : "";
      const safeFile = (value) => {
        const path = cleanText(value).replace(/\\/g, "/");
        if (!path || path.startsWith("/") || /^[a-z][a-z0-9+.-]*:/i.test(path) || path.split("/").includes("..")) return "";
        return path;
      };
      const para = cleanText(data.para);
      const de = cleanText(data.de);
      const extras = data.extras && typeof data.extras === "object" ? data.extras : {};
      const principal = data.principal && typeof data.principal === "object" ? data.principal : {};
      const inicio = data.inicio && typeof data.inicio === "object" ? data.inicio : {};
      const cierre = data.cierre && typeof data.cierre === "object" ? data.cierre : {};
      const title = cleanText(principal.titulo) || (para ? "Un álbum para " + para : "Álbum de recuerdos");
      const subtitle = cleanText(principal.subtitulo);
      const startTitle = cleanText(inicio.titulo) || (para ? "Una sorpresa para " + para : "Un regalo para vos");
      const startLabel = cleanText(inicio.boton) || "Tocá para empezar";
      const song = safeFile(data.musica);
      const rawGame = cleanText(extras.juego);
      const gameName = ["pintar-corazon", "margarita", "laberinto"].includes(rawGame) ? rawGame : "";
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const records = Array.isArray(data.fotos) ? data.fotos.slice(0, 12).filter((photo) => photo && typeof photo === "object") : [];
      const validRecords = records.map((photo) => ({
        src: safeFile(photo.src),
        alt: cleanText(photo.alt),
        epigrafe: cleanText(photo.epigrafe)
      }));
      const startSeconds = Number.isInteger(data.automatico) && data.automatico > 0 ? Math.min(data.automatico, 3600) : 0;

      const intro = document.getElementById("introScreen");
      const startButton = document.getElementById("startButton");
      const gameScreen = document.getElementById("gameScreen");
      const gamePrompt = document.getElementById("gamePrompt");
      const gameRecipient = document.getElementById("gameRecipient");
      const gameStage = document.getElementById("gameStage");
      const gameStatus = document.getElementById("gameStatus");
      const rescueButton = document.getElementById("rescueButton");
      const envelopeScreen = document.getElementById("envelopeScreen");
      const contentScreen = document.getElementById("contentScreen");
      const albumTitle = document.getElementById("albumTitle");
      const albumSubtitle = document.getElementById("albumSubtitle");
      const albumStage = document.getElementById("albumStage");
      const albumCaption = document.getElementById("albumCaption");
      const albumStatus = document.getElementById("albumStatus");
      const albumView = document.getElementById("albumView");
      const emptyMessage = document.getElementById("emptyMessage");
      const previousButton = document.getElementById("previousButton");
      const nextButton = document.getElementById("nextButton");
      const galleryButton = document.getElementById("galleryButton");
      const galleryDialog = document.getElementById("galleryDialog");
      const galleryGrid = document.getElementById("galleryGrid");
      const photoDialog = document.getElementById("photoDialog");
      const lightboxImage = document.getElementById("lightboxImage");
      const closingBlock = document.getElementById("albumClosing");
      const closingMessage = document.getElementById("closingMessage");
      const signatureNode = document.getElementById("signature");
      const counterRoot = document.getElementById("togetherCounter");
      const ambientLayer = document.getElementById("ambientHearts");
      const tapLayer = document.getElementById("tapHeartLayer");
      const effectsCanvas = document.getElementById("effectsCanvas");
      const audio = document.getElementById("backgroundMusic");
      const musicToggle = document.getElementById("musicToggle");
      const autoControl = document.getElementById("autoControl");
      const autoToggle = document.getElementById("autoToggle");
      let index = 0;
      let contentShown = false;
      let startHandled = false;
      let gameInstance = null;
      let gameTimer = 0;
      let autoTimer = 0;
      let autoPaused = false;
      let isDragging = false;
      let pointerStart = null;
      let swipePending = false;
      let celebrationShown = false;

      document.title = title + " | Eros Web";
      document.getElementById("introTitle").textContent = startTitle;
      startButton.textContent = startLabel;
      albumTitle.textContent = title;
      albumSubtitle.textContent = subtitle;
      closingMessage.textContent = cleanText(cierre.mensaje);
      signatureNode.textContent = cleanText(data.firma);
      if (!subtitle) albumSubtitle.hidden = true;
      if (!cleanText(cierre.mensaje)) closingMessage.hidden = true;
      if (!cleanText(data.firma)) signatureNode.hidden = true;
      if (para) {
        gameRecipient.textContent = "Un juego para " + para;
        gameRecipient.hidden = false;
      }
      gamePrompt.textContent = para ? "Una sorpresa para " + para : "Una sorpresa para vos";
      if (window.ErosContador) window.ErosContador.montar(counterRoot, extras.contador);
      const envelope = window.ErosSobre ? window.ErosSobre.montar(envelopeScreen, openContent) : null;
      if (window.NucleoMusica) window.NucleoMusica.conectar(song, audio, musicToggle);
      else musicToggle.hidden = true;
      if (startSeconds) autoControl.hidden = false;

      function makeImageButton(record, photoIndex, stackClass) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "polaroid " + stackClass;
        button.setAttribute("aria-label", record.alt || "Ampliar foto " + (photoIndex + 1));
        const image = document.createElement("img");
        image.className = "polaroid-image";
        image.alt = record.alt || "Foto " + (photoIndex + 1);
        image.decoding = "async";
        image.loading = photoIndex === index ? "eager" : "lazy";
        const placeholder = document.createElement("span");
        placeholder.className = "photo-placeholder";
        placeholder.textContent = record.src ? "La foto no está disponible" : "Todavía no se agregó una foto";
        placeholder.hidden = Boolean(record.src);
        if (record.src) {
          image.src = record.src;
          image.addEventListener("error", () => {
            image.hidden = true;
            placeholder.hidden = false;
            button.disabled = true;
            button.setAttribute("aria-label", "Foto no disponible");
          }, { once: true });
        } else {
          image.hidden = true;
        }
        button.append(image, placeholder);
        button.addEventListener("click", () => {
          if (swipePending) {
            swipePending = false;
            return;
          }
          if (record.src && !image.hidden) openPhoto(record.src, image.alt);
        });
        return button;
      }

      function renderStack() {
        albumStage.replaceChildren();
        if (!validRecords.length) {
          albumView.hidden = true;
          emptyMessage.hidden = false;
          return;
        }
        albumView.hidden = false;
        emptyMessage.hidden = true;
        const visible = Math.min(4, validRecords.length);
        for (let offset = visible - 1; offset >= 0; offset -= 1) {
          const photoIndex = (index + offset) % validRecords.length;
          const className = offset === 0 ? "is-front" : "is-back-" + offset;
          const card = makeImageButton(validRecords[photoIndex], photoIndex, "stack-card " + className);
          card.dataset.photoIndex = String(photoIndex);
          albumStage.appendChild(card);
        }
        const current = validRecords[index];
        albumCaption.textContent = current.epigrafe;
        albumCaption.hidden = !current.epigrafe;
        albumStatus.textContent = (index + 1) + " / " + validRecords.length;
        previousButton.disabled = index === 0;
        nextButton.disabled = index >= validRecords.length - 1;
        renderGallery();
        if (contentShown && index === validRecords.length - 1) {
          closingBlock.hidden = false;
          if (!celebrationShown) {
            celebrationShown = true;
            celebrate();
            stopAutomatic();
          }
        } else {
          closingBlock.hidden = true;
        }
      }

      function renderGallery() {
        galleryGrid.replaceChildren();
        validRecords.forEach((record, photoIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "gallery-thumb";
          button.setAttribute("aria-label", "Ver foto " + (photoIndex + 1) + " ampliada");
          button.setAttribute("aria-current", String(photoIndex === index));
          const image = document.createElement("img");
          image.alt = record.alt || "Foto " + (photoIndex + 1);
          image.loading = "lazy";
          image.decoding = "async";
          if (record.src) {
            image.src = record.src;
            image.addEventListener("error", () => { image.hidden = true; }, { once: true });
          } else {
            image.hidden = true;
          }
          const caption = document.createElement("span");
          caption.textContent = record.epigrafe || "Foto " + (photoIndex + 1);
          button.append(image, caption);
          button.addEventListener("click", () => {
            if (!record.src || image.hidden) return;
            openPhoto(record.src, image.alt);
          });
          galleryGrid.appendChild(button);
        });
      }

      function openPhoto(src, alt) {
        if (!src || typeof photoDialog.showModal !== "function") return;
        lightboxImage.src = src;
        lightboxImage.alt = alt || "Foto ampliada";
        photoDialog.showModal();
      }
      function closePhoto() {
        if (photoDialog.open) photoDialog.close();
      }
      document.getElementById("closePhoto").addEventListener("click", closePhoto);
      lightboxImage.addEventListener("click", closePhoto);
      photoDialog.addEventListener("click", (event) => { if (event.target === photoDialog) closePhoto(); });
      photoDialog.addEventListener("close", () => { lightboxImage.removeAttribute("src"); lightboxImage.alt = ""; });

      function openGallery() {
        renderGallery();
        if (typeof galleryDialog.showModal === "function") galleryDialog.showModal();
      }
      document.getElementById("closeGallery").addEventListener("click", () => galleryDialog.close());
      galleryDialog.addEventListener("click", (event) => { if (event.target === galleryDialog) galleryDialog.close(); });
      galleryButton.addEventListener("click", openGallery);

      function stopAutomatic() {
        if (autoTimer) window.clearInterval(autoTimer);
        autoTimer = 0;
      }
      function startAutomatic() {
        stopAutomatic();
        if (!startSeconds || autoPaused || !contentShown || index >= validRecords.length - 1) return;
        autoTimer = window.setInterval(() => {
          if (!galleryDialog.open && !photoDialog.open) goNext();
        }, startSeconds * 1000);
      }
      autoToggle.addEventListener("click", () => {
        autoPaused = !autoPaused;
        autoToggle.textContent = autoPaused ? "Reanudar avance" : "Pausar avance";
        autoToggle.setAttribute("aria-pressed", String(autoPaused));
        if (autoPaused) stopAutomatic();
        else startAutomatic();
      });

      function goTo(nextIndex) {
        if (nextIndex < 0 || nextIndex >= validRecords.length || nextIndex === index) return;
        index = nextIndex;
        renderStack();
        if (startSeconds && !autoPaused) startAutomatic();
      }
      function goNext() { goTo(index + 1); }
      function goPrevious() { goTo(index - 1); }
      previousButton.addEventListener("click", goPrevious);
      nextButton.addEventListener("click", goNext);

      function setDragTransform(card, dx, dy) {
        card.style.transition = "none";
        card.style.transform = "translate(" + dx + "px," + Math.max(-12, Math.min(12, dy * .15)) + "px) rotate(" + (dx / 22) + "deg)";
      }
      albumStage.addEventListener("pointerdown", (event) => {
        if (!contentShown || event.button !== undefined && event.button !== 0) return;
        const card = albumStage.querySelector(".is-front");
        if (!card) return;
        isDragging = true;
        swipePending = false;
        pointerStart = { id: event.pointerId, x: event.clientX, y: event.clientY, card };
        try { albumStage.setPointerCapture(event.pointerId); } catch (_) {}
      });
      albumStage.addEventListener("pointermove", (event) => {
        if (!isDragging || !pointerStart || event.pointerId !== pointerStart.id) return;
        const dx = event.clientX - pointerStart.x;
        const dy = event.clientY - pointerStart.y;
        if (Math.abs(dx) > Math.abs(dy) * 1.15 && Math.abs(dx) > 5) {
          event.preventDefault();
          setDragTransform(pointerStart.card, dx, dy);
        }
      });
      function finishDrag(event) {
        if (!isDragging || !pointerStart || event.pointerId !== pointerStart.id) return;
        const dx = event.clientX - pointerStart.x;
        const dy = event.clientY - pointerStart.y;
        const card = pointerStart.card;
        isDragging = false;
        pointerStart = null;
        try { albumStage.releasePointerCapture(event.pointerId); } catch (_) {}
        card.style.transition = "";
        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.2) {
          swipePending = true;
          card.style.setProperty("--fly-x", (dx < 0 ? "-115vw" : "115vw"));
          card.style.setProperty("--fly-turn", (dx < 0 ? "-22deg" : "22deg"));
          card.classList.add("is-leaving");
          window.setTimeout(() => {
            swipePending = false;
            if (dx < 0) goNext();
            else goPrevious();
          }, reducedMotion.matches ? 20 : 330);
        } else {
          card.style.transform = "";
          window.setTimeout(() => { card.style.transition = ""; }, 20);
        }
      }
      albumStage.addEventListener("pointerup", finishDrag);
      albumStage.addEventListener("pointercancel", finishDrag);
      document.addEventListener("keydown", (event) => {
        if (!contentShown || galleryDialog.open || photoDialog.open || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target && event.target.closest && event.target.closest("button,a,input,textarea,select")) return;
        if (event.key === "ArrowRight") { event.preventDefault(); goNext(); }
        if (event.key === "ArrowLeft") { event.preventDefault(); goPrevious(); }
      });

      function observeReveals() {
        const nodes = contentScreen.querySelectorAll(".reveal");
        if (!("IntersectionObserver" in window)) {
          nodes.forEach((node) => node.classList.add("is-visible"));
          return;
        }
        const observer = new IntersectionObserver((entries, current) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              current.unobserve(entry.target);
            }
          });
        }, { threshold: .12, rootMargin: "0px 0px -18px 0px" });
        nodes.forEach((node) => observer.observe(node));
      }

      function celebrate() {
        if (window.NucleoEfectos && typeof window.NucleoEfectos.explotar === "function") {
          const color = getComputedStyle(document.documentElement).getPropertyValue("--wine").trim() || "#8b3d52";
          window.NucleoEfectos.explotar(effectsCanvas, color);
        }
      }

      function openContent() {
        if (contentShown) return;
        contentShown = true;
        intro.hidden = true;
        gameScreen.hidden = true;
        envelopeScreen.hidden = true;
        contentScreen.hidden = false;
        contentScreen.classList.add("is-opening");
        if (window.NucleoEfectos && typeof window.NucleoEfectos.iniciarLluvia === "function") {
          window.NucleoEfectos.iniciarLluvia(ambientLayer, reducedMotion.matches);
        }
        if (window.NucleoEfectos && typeof window.NucleoEfectos.corazonAlTocar === "function") {
          contentScreen.addEventListener("pointerdown", (event) => {
            if (!event.target.closest("button,a,dialog")) window.NucleoEfectos.corazonAlTocar(tapLayer, event, reducedMotion.matches);
          });
        }
        observeReveals();
        requestAnimationFrame(() => {
          contentScreen.classList.remove("is-opening");
          contentScreen.classList.add("is-open");
          albumTitle.focus({ preventScroll: true });
          window.scrollTo({ top: 0, behavior: reducedMotion.matches ? "auto" : "smooth" });
          renderStack();
        });
        // Arranca sin depender del repintado: algunos celulares pausan requestAnimationFrame.
        startAutomatic();
      }

      function showEnvelopeOrContent() {
        if (extras.sobre !== false && envelope) {
          gameScreen.hidden = true;
          envelope.mostrar();
        } else {
          openContent();
        }
      }
      function cleanupGame() {
        window.clearTimeout(gameTimer);
        if (gameInstance && typeof gameInstance.destruir === "function") {
          try { gameInstance.destruir(); } catch (_) {}
        }
        gameInstance = null;
        gameStage.replaceChildren();
        document.body.classList.remove("playing");
      }
      function finishGame() {
        cleanupGame();
        if (window.NucleoEfectos && typeof window.NucleoEfectos.explotar === "function") {
          const color = getComputedStyle(document.documentElement).getPropertyValue("--wine").trim() || "#8b3d52";
          window.NucleoEfectos.explotar(effectsCanvas, color, showEnvelopeOrContent);
        } else showEnvelopeOrContent();
      }
      function skipGame() {
        cleanupGame();
        showEnvelopeOrContent();
      }
      function loadGame() {
        gameScreen.hidden = false;
        document.body.classList.add("playing");
        gamePrompt.focus({ preventScroll: true });
        gameTimer = window.setTimeout(() => { rescueButton.hidden = false; }, 60000);
        const script = document.createElement("script");
        script.src = "../../plantillas/juegos-interactivos/juegos/" + gameName + ".js";
        script.onload = () => {
          const game = window.JUEGOS && window.JUEGOS[gameName];
          if (!game || typeof game.iniciar !== "function") {
            gameStatus.textContent = "El juego no está disponible. Podés seguir al álbum.";
            rescueButton.hidden = false;
            return;
          }
          try {
            gameInstance = game.iniciar(gameStage, {}, finishGame, {
              color: getComputedStyle(document.documentElement).getPropertyValue("--wine").trim() || "#8b3d52",
              para: para, de: de
            });
          } catch (_) {
            gameStatus.textContent = "No se pudo abrir el juego. Podés seguir al álbum.";
            rescueButton.hidden = false;
          }
        };
        script.onerror = () => {
          gameStatus.textContent = "No se pudo cargar el juego. Podés seguir al álbum.";
          rescueButton.hidden = false;
        };
        document.body.appendChild(script);
      }

      function startExperience() {
        if (startHandled) return;
        startHandled = true;
        intro.hidden = true;
        if (song && window.NucleoMusica) window.NucleoMusica.iniciar();
        if (gameName) loadGame();
        else showEnvelopeOrContent();
      }

      renderStack();
      startButton.addEventListener("click", startExperience);
    })();
  </script>
</body>
</html>
