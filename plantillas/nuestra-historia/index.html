<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f5">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f4b8c1'/%3E%3Cpath d='M32 49S12 37 12 24c0-10 13-14 20-4 7-10 20-6 20 4 0 13-20 25-20 25Z' fill='%23fffaf6'/%3E%3C/svg%3E">
  <title>Nuestra historia | Eros Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --cream: #fff8f5;
      --paper: #fffdfb;
      --pink: #f4b8c1;
      --pink-pale: #ffe9eb;
      --blue: #dcecf5;
      --blue-deep: #315b70;
      --wine: #8b3d52;
      --wine-rgb: 139,61,82;
      --ink: #302b31;
      --muted: #665f67;
      --line: #eadfe0;
      --shadow: 0 18px 50px rgba(75,48,57,.12);
      --heart-color: #a9445d;
      --button-ink: #fff;
      --theme-background: radial-gradient(ellipse at 18% 12%,#ffe7e8 0,transparent 36%),radial-gradient(ellipse at 90% 86%,#e3f1f7 0,transparent 34%),#fff8f5;
    }
    *,*::before,*::after{box-sizing:border-box}
    [hidden]{display:none!important}
    html{min-width:320px;scroll-behavior:smooth}
    body{position:relative;margin:0;min-width:320px;min-height:100vh;color:var(--ink);background:var(--theme-background);font-family:"DM Sans",sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
    body.playing{height:100svh;overflow:hidden;overscroll-behavior:none}
    button,a{font:inherit}
    img,svg,canvas{display:block;max-width:100%}
    :focus-visible{outline:3px solid #215f7b;outline-offset:4px}
    main{position:relative;z-index:1}
    .screen{min-height:100svh}
    .button{display:inline-flex;min-width:190px;min-height:58px;align-items:center;justify-content:center;gap:9px;padding:14px 23px;border:0;border-radius:999px;color:var(--button-ink);background:var(--wine);box-shadow:0 9px 22px rgba(75,48,57,.16);font-weight:700;text-align:center;text-decoration:none;cursor:pointer;transition:transform .2s ease,filter .2s ease,box-shadow .2s ease}
    .button:hover{transform:translateY(-2px);filter:brightness(.94);box-shadow:0 12px 25px rgba(75,48,57,.2)}
    .button:active{transform:translateY(0)}
    .intro-screen{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(28px,env(safe-area-inset-top)) 18px max(32px,env(safe-area-inset-bottom));text-align:center}
    .intro-content{width:min(100%,560px);margin:auto}
    .intro-heart{display:grid;width:78px;height:78px;place-items:center;margin:0 auto 19px;border:1px solid rgba(var(--wine-rgb),.13);border-radius:28px;color:var(--wine);background:var(--paper);box-shadow:var(--shadow);font-size:2.45rem}
    .intro-title{margin:0 0 27px;font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.9rem,7vw,2.7rem);font-weight:600;letter-spacing:-.035em;line-height:1.15}
    .intro-screen .button{width:min(100%,290px)}
    .game-screen{position:relative;z-index:3;display:grid;min-height:100svh;align-items:center;padding:max(18px,env(safe-area-inset-top)) 15px max(18px,env(safe-area-inset-bottom))}
    .game-layout{position:relative;z-index:2;width:min(100%,690px);margin:auto;padding:clamp(20px,5vw,40px);border:1px solid rgba(var(--wine-rgb),.1);border-radius:28px;background:var(--paper);box-shadow:var(--shadow);text-align:center}
    .game-recipient{margin:0 0 5px;color:var(--blue-deep);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    .game-prompt:focus{outline:none}
    .game-prompt{margin:0 auto 14px;color:var(--wine);font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.45rem,5.6vw,2.15rem);line-height:1.2}
    .game-stage{width:min(100%,560px);margin:0 auto;touch-action:none}
    .game-status{min-height:28px;margin:10px 0 0;color:var(--muted);font-size:.92rem}
    .rescue-link{min-height:48px;margin:12px auto 0;padding:9px 16px;border:1px solid rgba(var(--wine-rgb),.24);border-radius:999px;color:var(--wine);background:var(--paper);font-size:.9rem;font-weight:700;cursor:pointer}
    .paint-canvas,.maze-canvas{width:min(100%,520px);height:auto;margin:auto;aspect-ratio:1;border-radius:20px;background:linear-gradient(145deg,var(--pink-pale),var(--blue));touch-action:none}
    .paint-progress{width:min(100%,360px);margin:10px auto 0;text-align:left}
    .paint-progress-label{display:block;margin-bottom:5px;color:var(--muted);font-size:.78rem;font-weight:700}
    .paint-progress-track{height:11px;overflow:hidden;border-radius:999px;background:var(--line)}
    .paint-progress-fill{width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pink),var(--wine));transform:scaleX(0);transform-origin:left center;transition:transform .18s ease}
    .flower-verdict{margin:0 0 3px;color:var(--wine);font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.8rem,8vw,2.6rem);font-weight:600}
    .flower-stage{position:relative;width:min(82vw,410px);margin:0 auto;aspect-ratio:1;touch-action:manipulation}
    .flower-petal{position:absolute;display:grid;width:clamp(31px,10vw,50px);height:clamp(52px,17vw,76px);place-items:center;padding:0;border:1px solid rgba(139,61,82,.22);border-radius:50% 50% 44% 44%;background:linear-gradient(135deg,#fff,#ffe7a5);box-shadow:0 4px 12px rgba(75,48,57,.1);cursor:pointer;transform:translate(-50%,-50%) rotate(var(--angle));transform-origin:center}
    .flower-petal:hover{filter:brightness(1.03)}
    .flower-petal.is-picked{pointer-events:none;animation:petal-fall .72s ease-in forwards}
    .flower-center{position:absolute;z-index:2;top:50%;left:50%;display:grid;width:clamp(72px,22vw,100px);aspect-ratio:1;place-items:center;border:2px solid rgba(139,61,82,.16);border-radius:50%;color:#fffdf2;background:radial-gradient(circle at 35% 30%,#ffe9a8,#eaa642 72%);box-shadow:0 5px 14px rgba(75,48,57,.12);font-size:2rem;transform:translate(-50%,-50%)}
    .flower-progress{margin:2px 0 0;color:var(--muted);font-size:.88rem}
    .maze-help{margin:6px 0 0;color:var(--muted);font-size:.82rem}
    .content-screen{position:relative;z-index:2;min-height:100svh;padding:28px 16px 22px;opacity:0;transition:opacity .65s ease}
    .content-screen.is-opening{transition:none}
    .content-screen.is-open{opacity:1}
    .story-shell{position:relative;z-index:2;width:min(100%,940px);margin:0 auto;padding:clamp(24px,6vw,58px);overflow:hidden;border:1px solid rgba(var(--wine-rgb),.12);border-radius:30px;background:var(--paper);box-shadow:var(--shadow)}
    .story-header{position:relative;z-index:2;max-width:650px;margin:0 auto 34px;text-align:center}
    .story-heading{margin:0 0 12px;color:var(--wine);font-family:"Playfair Display",Georgia,serif;font-size:clamp(2.2rem,8vw,4.3rem);font-weight:600;letter-spacing:-.04em;line-height:1.08}
    .story-subtitle{margin:0;color:var(--muted);font-size:clamp(1rem,2.4vw,1.16rem)}
    .together-counter{max-width:510px;margin:26px auto 0;text-align:center}
    .timeline{position:relative;width:100%;margin:0 auto;padding:14px 0 28px}
    .timeline-route{position:absolute;z-index:0;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;color:var(--wine)}
    .route-track,.route-progress{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.5;vector-effect:non-scaling-stroke}
    .route-track{opacity:.23}
    .route-progress{stroke:var(--wine);stroke-width:3.5}
    .route-stop{fill:var(--paper);stroke:var(--wine);stroke-width:2.5;vector-effect:non-scaling-stroke}
    .route-heart{fill:var(--heart-color);font-family:"DM Sans",sans-serif;font-size:27px;paint-order:stroke;stroke:var(--paper);stroke-width:2px}
    .moment-list{position:relative;z-index:1;display:grid;gap:34px;margin:0;padding:0;list-style:none}
    .moment{position:relative;width:calc(100% - 38px);min-width:0;margin-left:38px}
    .moment-body{max-width:100%;padding:0}
    .moment-date{display:inline-flex;min-height:33px;align-items:center;margin:0 0 12px;padding:5px 13px;border:1px solid var(--line);border-radius:999px;color:var(--wine);background:var(--pink-pale);font-size:.82rem;font-weight:700;line-height:1.2}
    .moment-photo{display:flex;max-width:100%;align-items:center;gap:9px;margin:0 0 14px}
    .moment-photo.photo-left{justify-content:flex-start}
    .moment-photo.photo-right{justify-content:flex-end}
    .photo-frame{width:min(72%,260px);min-width:0;margin:0;padding:7px 7px 12px;border:1px solid rgba(var(--wine-rgb),.12);border-radius:7px;background:linear-gradient(145deg,var(--pink-pale),var(--blue) 55%,var(--paper));box-shadow:0 12px 26px rgba(75,48,57,.18)}
    .photo-frame.reveal{transform:rotate(var(--tilt)) translateY(12px);transition:opacity .7s ease,transform .7s ease}
    .photo-frame.reveal.is-visible{transform:rotate(var(--tilt)) translateY(0)}
    .photo-trigger{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}
    .photo-trigger img{width:100%;aspect-ratio:4/4.8;border-radius:3px;background:linear-gradient(145deg,var(--pink-pale),var(--blue));object-fit:cover;animation:photo-drift 7s ease-in-out infinite alternate}
    .photo-heart-doodle{flex:0 0 clamp(36px,10vw,58px);width:clamp(36px,10vw,58px);height:auto;overflow:visible;opacity:.9}
    .photo-heart-doodle path{fill:none;stroke:var(--wine);stroke-linecap:round;stroke-linejoin:round}
    .photo-heart-doodle .doodle-heart{stroke-width:2.15}
    .photo-heart-doodle .doodle-echo{stroke-width:1.2;opacity:.52}
    .photo-heart-doodle .doodle-vein{stroke-width:1.45;opacity:.7}
    .photo-heart-doodle .doodle-spark{stroke-width:1.5;opacity:.58}
    .moment-title{margin:0 0 7px;color:var(--wine);font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.35rem,4.8vw,1.8rem);font-weight:600;line-height:1.2}
    .moment-text{margin:0;color:var(--ink);font-size:1rem}
    .closing{position:relative;z-index:2;padding:36px 0 6px;text-align:center}
    .closing-message{max-width:620px;margin:0 auto 13px;color:var(--ink);font-size:clamp(1rem,2.5vw,1.15rem)}
    .closing-heart{display:inline-block;color:var(--wine);font-size:4rem;line-height:1.1;animation:heartbeat 1.7s ease-in-out infinite}
    .signature{margin:7px 0 0;color:var(--wine);font-family:"Playfair Display",Georgia,serif;font-size:1.65rem}
    .site-footer{position:relative;z-index:2;padding:14px 0 max(16px,env(safe-area-inset-bottom));color:var(--muted);font-size:.86rem;text-align:center}
    .ambient-hearts{position:fixed;z-index:0;inset:0;overflow:hidden;pointer-events:none}
    .ambient-heart{position:absolute;top:-42px;left:var(--x);color:var(--heart-color);font-size:var(--size);line-height:1;opacity:0;animation:heart-rain var(--duration) linear var(--delay) infinite;will-change:transform}
    .tap-heart-layer{position:fixed;z-index:12;inset:0;overflow:hidden;pointer-events:none}
    .tap-heart{position:fixed;color:var(--heart-color);font-size:28px;line-height:1;text-shadow:0 2px 9px rgba(var(--wine-rgb),.2);animation:tap-pop .95s ease-out both}
    .music-toggle{position:fixed;z-index:30;top:max(14px,env(safe-area-inset-top));right:14px;display:inline-flex;min-width:48px;min-height:48px;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border:1px solid rgba(var(--wine-rgb),.18);border-radius:999px;color:var(--wine);background:var(--paper);box-shadow:0 7px 20px rgba(75,48,57,.12);font-size:.88rem;font-weight:700;cursor:pointer}
    .music-toggle:hover{filter:brightness(.98)}
    .confetti-layer{position:fixed;z-index:40;inset:0;overflow:hidden;pointer-events:none}
    .confetti-heart{position:absolute;top:50%;left:50%;color:var(--heart-color);font-size:var(--size);line-height:1;opacity:.98;animation:confetti-burst 1.55s cubic-bezier(.16,.72,.28,1) both;animation-delay:var(--delay)}
    .photo-dialog{width:min(94vw,1000px);max-width:none;max-height:92svh;padding:10px;overflow:visible;border:1px solid rgba(255,255,255,.45);border-radius:20px;background:var(--paper);box-shadow:0 24px 90px rgba(20,14,17,.38)}
    .photo-dialog::backdrop{background:rgba(35,26,31,.82);backdrop-filter:blur(4px)}
    .photo-dialog img{width:100%;max-height:calc(92svh - 20px);border-radius:13px;object-fit:contain;cursor:zoom-out}
    .dialog-close{position:absolute;top:-13px;right:-8px;display:grid;width:46px;height:46px;place-items:center;border:2px solid #fff;border-radius:50%;color:var(--button-ink);background:var(--wine);font-size:1.7rem;line-height:1;cursor:pointer}
    .effects-canvas{position:fixed;z-index:50;inset:0;width:100%;height:100%;pointer-events:none}
    .reveal{opacity:0;transform:translateY(14px);transition:opacity .65s ease,transform .65s ease}
    .reveal.is-visible{opacity:1;transform:translateY(0)}
    @keyframes heart-rain{0%{opacity:0;transform:translate3d(0,-6vh,0) rotate(-8deg)}8%{opacity:var(--alpha);transform:translate3d(0,0,0) rotate(-4deg)}50%{opacity:var(--alpha);transform:translate3d(var(--mid-sway),52vh,0) rotate(var(--turn))}92%{opacity:var(--alpha)}100%{opacity:0;transform:translate3d(var(--sway),110vh,0) rotate(var(--turn))}}
    @keyframes tap-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}22%{opacity:1;transform:translate(-50%,-65%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-130%) scale(.8)}}
    @keyframes photo-drift{from{translate:0 0}to{translate:0 -7px}}
    @keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}24%{transform:scale(1)}36%{transform:scale(1.08)}52%{transform:scale(1)}}
    @keyframes confetti-burst{0%{opacity:0;transform:translate3d(0,0,0) scale(.3) rotate(0)}14%{opacity:.98}100%{opacity:0;transform:translate3d(var(--drift),var(--fall),0) scale(1.08) rotate(var(--turn))}}
    @keyframes petal-fall{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle))}100%{opacity:0;transform:translate(calc(-50% + var(--fall-x)),calc(-50% + 120px)) rotate(calc(var(--angle) + 130deg))}}
    @media(min-width:700px){.content-screen{padding:38px 22px 28px}.story-shell{padding:clamp(40px,6vw,68px)}.story-header{margin-bottom:48px}}
    @media(min-width:800px){.moment-list{gap:48px}.moment{width:calc(50% - 30px)}.moment[data-side="left"]{margin-right:auto;margin-left:0}.moment[data-side="right"]{margin-right:0;margin-left:auto}.moment-body{max-width:100%}.photo-frame{width:min(68%,260px)}.timeline{padding-top:22px}}
    @media(max-width:400px){.content-screen{padding:18px 10px}.story-shell{padding:22px 16px;border-radius:24px}.moment-list{gap:28px}.photo-frame{width:min(72%,230px)}.moment-photo{gap:6px}.photo-heart-doodle{flex-basis:36px;width:36px}.game-screen{padding-inline:10px}.game-layout{padding:18px 14px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.button,.content-screen,.reveal,.paint-progress-fill{transition-duration:.01ms!important}.tap-heart,.confetti-heart,.closing-heart,.photo-trigger img,.flower-petal.is-picked{animation:none!important}.flower-petal.is-picked{opacity:0}.ambient-heart{animation-duration:60s!important;opacity:.18}}
  </style>
</head>
<body>
  <main>
    <section class="screen intro-screen" id="introScreen" aria-labelledby="introTitle">
      <div class="intro-content">
        <div class="intro-heart" aria-hidden="true">♡</div>
        <h1 class="intro-title" id="introTitle">Un regalo para vos</h1>
        <button class="button" id="startButton" type="button">Tocá para empezar</button>
      </div>
    </section>

    <section class="screen game-screen" id="gameScreen" aria-labelledby="gamePrompt" hidden>
      <div class="game-layout">
        <p class="game-recipient" id="gameRecipient" hidden></p>
        <h1 class="game-prompt" id="gamePrompt" tabindex="-1"></h1>
        <div class="game-stage" id="gameStage" aria-label="Juego interactivo"></div>
        <p class="game-status" id="gameStatus" role="status" aria-live="polite"></p>
        <button class="rescue-link" id="rescueButton" type="button" hidden>Pasar a nuestra historia</button>
      </div>
    </section>

    <section class="screen envelope-screen" id="envelopeScreen" hidden></section>

    <section class="content-screen" id="contentScreen" aria-labelledby="storyTitle" hidden>
      <div class="ambient-hearts" id="ambientHearts" aria-hidden="true"></div>
      <div class="tap-heart-layer" id="tapHeartLayer" aria-hidden="true"></div>
      <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false" aria-label="Pausar música" hidden>
        <span aria-hidden="true">♫</span><span id="musicText">Pausar música</span>
      </button>
      <audio id="backgroundMusic" preload="none" loop></audio>
      <div class="story-shell">
        <header class="story-header">
          <h1 class="story-heading reveal" id="storyTitle" tabindex="-1"></h1>
          <p class="story-subtitle reveal" id="storySubtitle"></p>
          <section class="together-counter reveal" id="togetherCounter" aria-label="Tiempo juntos" hidden></section>
        </header>
        <section class="timeline" id="timeline" aria-label="Momentos de nuestra historia">
          <svg class="timeline-route" id="timelineRoute" role="presentation" aria-hidden="true"></svg>
          <ol class="moment-list" id="momentList"></ol>
        </section>
        <div class="closing reveal" id="closingBlock">
          <p class="closing-message" id="closingMessage"></p>
          <span class="closing-heart" aria-hidden="true">♥</span>
          <p class="signature" id="signature"></p>
        </div>
      </div>
      <footer class="site-footer" id="siteFooter">Eros Web</footer>
    </section>
  </main>

  <dialog class="photo-dialog" id="photoDialog" aria-label="Foto ampliada">
    <button class="dialog-close" id="closePhoto" type="button" aria-label="Cerrar foto">×</button>
    <img id="lightboxImage" alt="">
  </dialog>
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  <canvas class="effects-canvas" id="effectsCanvas" aria-hidden="true" hidden></canvas>

  <script src="datos.js"></script>
  <script src="../../compartido/temas.js"></script>
  <script src="../../compartido/sobre.js"></script>
  <script src="../../compartido/contador.js"></script>
  <script src="../../plantillas/juegos-interactivos/nucleo/efectos.js"></script>
  <script>
    (() => {
      "use strict";
      const data = window.DATOS && typeof window.DATOS === "object" ? window.DATOS : {};
      const text = (value) => typeof value === "string" ? value.trim() : "";
      const safeFile = (value) => {
        const path = text(value).replace(/\\/g, "/");
        if (!path || path.startsWith("/") || /^[a-z][a-z0-9+.-]*:/i.test(path) || path.split("/").includes("..")) return "";
        return path;
      };
      const para = text(data.para);
      const de = text(data.de);
      const extras = data.extras && typeof data.extras === "object" ? data.extras : {};
      const principal = data.principal && typeof data.principal === "object" ? data.principal : {};
      const inicio = data.inicio && typeof data.inicio === "object" ? data.inicio : {};
      const cierre = data.cierre && typeof data.cierre === "object" ? data.cierre : {};
      const startTitle = text(inicio.titulo) || (para ? "Un recorrido para " + para : "Un recorrido para vos");
      const startLabel = text(inicio.boton) || "Tocá para empezar";
      const title = text(principal.titulo) || (para ? "Nuestra historia, " + para : "Nuestra historia");
      const subtitle = text(principal.subtitulo);
      const song = safeFile(data.musica);
      const preferredColor = text(data.colorPrincipal);
      const customColor = /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(preferredColor) ? preferredColor : "";
      const showEnvelope = extras.sobre !== false;
      const rawGame = text(extras.juego);
      const gameName = ["pintar-corazon", "margarita", "laberinto"].includes(rawGame) ? rawGame : "";
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const intro = document.getElementById("introScreen");
      const startButton = document.getElementById("startButton");
      const gameScreen = document.getElementById("gameScreen");
      const gamePrompt = document.getElementById("gamePrompt");
      const gameRecipient = document.getElementById("gameRecipient");
      const gameStage = document.getElementById("gameStage");
      const gameStatus = document.getElementById("gameStatus");
      const rescueButton = document.getElementById("rescueButton");
      const envelopeScreen = document.getElementById("envelopeScreen");
      const contentScreen = document.getElementById("contentScreen");
      const titleNode = document.getElementById("storyTitle");
      const subtitleNode = document.getElementById("storySubtitle");
      const closingMessage = document.getElementById("closingMessage");
      const signatureNode = document.getElementById("signature");
      const siteFooter = document.getElementById("siteFooter");
      const counterRoot = document.getElementById("togetherCounter");
      const momentList = document.getElementById("momentList");
      const timeline = document.getElementById("timeline");
      const routeSvg = document.getElementById("timelineRoute");
      const ambientLayer = document.getElementById("ambientHearts");
      const tapLayer = document.getElementById("tapHeartLayer");
      const confettiLayer = document.getElementById("confettiLayer");
      const audio = document.getElementById("backgroundMusic");
      const musicToggle = document.getElementById("musicToggle");
      const musicText = document.getElementById("musicText");
      const photoDialog = document.getElementById("photoDialog");
      const lightboxImage = document.getElementById("lightboxImage");
      const effectsCanvas = document.getElementById("effectsCanvas");
      const validMoments = Array.isArray(data.momentos) ? data.momentos.slice(0, 8) : [];
      let musicReady = Boolean(song);
      let gameInstance = null;
      let gameTimer = 0;
      let gameFinished = false;
      let contentShown = false;
      let routeFrame = 0;
      let confettiTimer = 0;
      let routeGeometry = null;
      let startHandled = false;

      if (customColor && !window.ErosTemas) {
        const hex = customColor.length === 4 ? customColor.slice(1).split("").map((part) => part + part).join("") : customColor.slice(1);
        const rgb = [0, 2, 4].map((index) => parseInt(hex.slice(index, index + 2), 16)).join(",");
        document.documentElement.style.setProperty("--wine", customColor);
        document.documentElement.style.setProperty("--wine-rgb", rgb);
      }
      document.title = title + " | Eros Web";
      document.getElementById("introTitle").textContent = startTitle;
      startButton.textContent = startLabel;
      titleNode.textContent = title;
      subtitleNode.textContent = subtitle;
      closingMessage.textContent = text(cierre.mensaje);
      signatureNode.textContent = text(data.firma);
      siteFooter.textContent = de ? "Hecho con ♡ por " + de + " · Eros Web" : "Eros Web";
      if (!subtitle) subtitleNode.hidden = true;
      if (!text(cierre.mensaje)) closingMessage.hidden = true;
      if (!text(data.firma)) signatureNode.hidden = true;
      if (para) {
        gameRecipient.textContent = "Un juego para " + para;
        gameRecipient.hidden = false;
      }
      gamePrompt.textContent = para ? "Un juego para " + para : "Una sorpresa antes de nuestra historia";
      if (window.ErosContador) window.ErosContador.montar(counterRoot, extras.contador);
      const envelope = window.ErosSobre ? window.ErosSobre.montar(envelopeScreen, openContent) : null;

      const doodlePaths = [
        ["doodle-heart", "M44 70 C38 65 13 48 9 32 C5 17 17 9 29 12 C36 14 41 19 44 26 C48 17 57 10 68 12 C80 15 84 27 79 38 C74 53 55 66 44 70 Z"],
        ["doodle-echo", "M43 67 C31 58 15 45 13 32 C11 23 16 17 24 16"],
        ["doodle-vein", "M22 25 C28 19 35 22 39 29 M51 25 C57 19 64 20 68 26"],
        ["doodle-spark", "M7 43l-4 1 M11 54l-3 3 M80 47l4 1 M76 58l3 3"]
      ];
      function createDoodle() {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "photo-heart-doodle");
        svg.setAttribute("viewBox", "0 0 88 82");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        doodlePaths.forEach(([name, d]) => {
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("class", name);
          path.setAttribute("d", d);
          svg.appendChild(path);
        });
        return svg;
      }

      function openPhoto(image) {
        lightboxImage.src = image.currentSrc || image.src;
        lightboxImage.alt = image.alt;
        if (typeof photoDialog.showModal === "function") photoDialog.showModal();
      }
      function closePhoto() {
        if (photoDialog.open) photoDialog.close();
        lightboxImage.removeAttribute("src");
        lightboxImage.alt = "";
      }

      function renderMoments() {
        const records = validMoments.filter((moment) => moment && typeof moment === "object" && (text(moment.fecha) || text(moment.titulo) || text(moment.texto)));
        if (!records.length) {
          timeline.hidden = true;
          return;
        }
        records.forEach((moment, index) => {
          const item = document.createElement("li");
          item.className = "moment reveal";
          item.dataset.side = index % 2 === 0 ? "left" : "right";
          const body = document.createElement("div");
          body.className = "moment-body";
          const date = text(moment.fecha);
          if (date) {
            const dateNode = document.createElement("time");
            dateNode.className = "moment-date";
            dateNode.textContent = date;
            body.appendChild(dateNode);
          }
          const imagePath = safeFile(moment.foto);
          if (imagePath) {
            const figure = document.createElement("figure");
            figure.className = "moment-photo reveal " + (index % 2 === 0 ? "photo-left" : "photo-right");
            figure.style.setProperty("--tilt", ["-3.5deg", "3deg", "-2.5deg", "2.5deg"][index % 4]);
            const frame = document.createElement("div");
            frame.className = "photo-frame reveal";
            const trigger = document.createElement("button");
            trigger.type = "button";
            trigger.className = "photo-trigger";
            const alt = text(moment.alt) || (para ? "Foto de un momento de " + para + " y " + (de || "su pareja") : "Foto de un momento especial");
            trigger.setAttribute("aria-label", "Ampliar foto: " + alt);
            const image = document.createElement("img");
            image.src = imagePath;
            image.alt = alt;
            image.loading = "lazy";
            image.decoding = "async";
            image.addEventListener("error", () => {
              figure.remove();
              requestRouteUpdate();
            }, { once: true });
            image.addEventListener("load", requestRouteUpdate, { once: true });
            trigger.appendChild(image);
            trigger.addEventListener("click", () => openPhoto(image));
            frame.appendChild(trigger);
            figure.append(frame, createDoodle());
            body.appendChild(figure);
          }
          const headingText = text(moment.titulo);
          if (headingText) {
            const heading = document.createElement("h2");
            heading.className = "moment-title";
            heading.textContent = headingText;
            body.appendChild(heading);
          }
          const paragraphText = text(moment.texto);
          if (paragraphText) {
            const paragraph = document.createElement("p");
            paragraph.className = "moment-text";
            paragraph.textContent = paragraphText;
            body.appendChild(paragraph);
          }
          item.appendChild(body);
          momentList.appendChild(item);
        });
        requestRouteUpdate();
      }

      function buildRoute() {
        if (!contentShown || timeline.hidden) return;
        const width = Math.max(1, timeline.clientWidth);
        const height = Math.max(1, timeline.scrollHeight);
        routeSvg.setAttribute("viewBox", "0 0 " + width + " " + height);
        routeSvg.setAttribute("preserveAspectRatio", "none");
        routeSvg.replaceChildren();
        const desktop = window.matchMedia("(min-width: 800px)").matches;
        const baseX = desktop ? width / 2 : Math.min(25, Math.max(20, width * .075));
        const items = Array.from(momentList.querySelectorAll(".moment"));
        const points = [{ x: baseX, y: 0 }];
        items.forEach((item, index) => {
          const y = Math.max(18, Math.min(height - 18, item.offsetTop + item.offsetHeight / 2));
          const sway = desktop ? (index % 2 === 0 ? -13 : 13) : Math.sin(index * 1.25) * 5;
          points.push({ x: baseX + sway, y });
        });
        points.push({ x: baseX, y: height });
        let d = "M " + points[0].x + " " + points[0].y;
        for (let i = 1; i < points.length; i += 1) {
          const previous = points[i - 1];
          const point = points[i];
          const mid = (previous.y + point.y) / 2;
          d += " C " + previous.x + " " + mid + ", " + point.x + " " + mid + ", " + point.x + " " + point.y;
        }
        const ns = "http://www.w3.org/2000/svg";
        const track = document.createElementNS(ns, "path");
        track.setAttribute("class", "route-track");
        track.setAttribute("d", d);
        routeSvg.appendChild(track);
        const progress = document.createElementNS(ns, "path");
        progress.setAttribute("class", "route-progress");
        progress.setAttribute("d", d);
        routeSvg.appendChild(progress);
        items.forEach((item, index) => {
          const point = points[index + 1];
          const stop = document.createElementNS(ns, "circle");
          stop.setAttribute("class", "route-stop");
          stop.setAttribute("cx", String(point.x));
          stop.setAttribute("cy", String(point.y));
          stop.setAttribute("r", "5.5");
          routeSvg.appendChild(stop);
        });
        const marker = document.createElementNS(ns, "text");
        marker.setAttribute("class", "route-heart");
        marker.setAttribute("text-anchor", "middle");
        marker.setAttribute("dominant-baseline", "central");
        marker.textContent = "♥";
        routeSvg.appendChild(marker);
        const length = progress.getTotalLength();
        progress.style.strokeDasharray = String(length);
        routeGeometry = { path: progress, marker, length, top: timeline.getBoundingClientRect().top + window.scrollY, height };
        updateRouteProgress();
      }

      function updateRouteProgress() {
        if (!routeGeometry) return;
        const viewport = window.innerHeight || document.documentElement.clientHeight;
        const start = routeGeometry.top - viewport * .26;
        const end = routeGeometry.top + routeGeometry.height - viewport * .72;
        const denominator = Math.max(1, end - start);
        const progress = Math.max(0, Math.min(1, (window.scrollY - start) / denominator));
        routeGeometry.path.style.strokeDashoffset = String(routeGeometry.length * (1 - progress));
        const point = routeGeometry.path.getPointAtLength(routeGeometry.length * progress);
        routeGeometry.marker.setAttribute("x", String(point.x));
        routeGeometry.marker.setAttribute("y", String(point.y));
      }

      function requestRouteUpdate() {
        if (routeFrame) cancelAnimationFrame(routeFrame);
        routeFrame = requestAnimationFrame(() => {
          routeFrame = 0;
          buildRoute();
        });
      }

      function observeReveals() {
        const items = contentScreen.querySelectorAll(".reveal");
        if (!("IntersectionObserver" in window)) {
          items.forEach((item) => item.classList.add("is-visible"));
          return;
        }
        const observer = new IntersectionObserver((entries, current) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              current.unobserve(entry.target);
            }
          });
        }, { threshold: .12, rootMargin: "0px 0px -18px 0px" });
        items.forEach((item) => observer.observe(item));
      }

      function startHearts() {
        const count = reducedMotion.matches ? 9 : 36;
        for (let i = 0; i < count; i += 1) {
          const heart = document.createElement("span");
          const duration = reducedMotion.matches ? 48 + Math.random() * 20 : 9 + Math.random() * 9;
          heart.className = "ambient-heart";
          heart.textContent = i % 2 === 0 ? "♥" : "♡";
          heart.style.setProperty("--x", Math.random() * 100 + "%");
          heart.style.setProperty("--size", 14 + Math.random() * 24 + "px");
          heart.style.setProperty("--duration", duration + "s");
          heart.style.setProperty("--delay", -Math.random() * duration + "s");
          heart.style.setProperty("--alpha", reducedMotion.matches ? ".18" : String(.25 + Math.random() * .45));
          heart.style.setProperty("--mid-sway", (Math.random() - .5) * 32 + "px");
          heart.style.setProperty("--sway", (Math.random() - .5) * 32 + "px");
          heart.style.setProperty("--turn", (Math.random() - .5) * 70 + "deg");
          ambientLayer.appendChild(heart);
        }
      }

      function showConfetti() {
        if (reducedMotion.matches) return;
        confettiLayer.replaceChildren();
        for (let i = 0; i < 42; i += 1) {
          const heart = document.createElement("span");
          heart.className = "confetti-heart";
          heart.textContent = i % 4 === 0 ? "♡" : "♥";
          heart.style.setProperty("--size", 18 + Math.random() * 25 + "px");
          heart.style.setProperty("--drift", (Math.random() - .5) * 100 + "vw");
          heart.style.setProperty("--fall", (Math.random() - .5) * 100 + "vh");
          heart.style.setProperty("--turn", (Math.random() - .5) * 110 + "deg");
          heart.style.setProperty("--delay", Math.random() * .3 + "s");
          heart.addEventListener("animationend", () => heart.remove(), { once: true });
          confettiLayer.appendChild(heart);
        }
        window.clearTimeout(confettiTimer);
        confettiTimer = window.setTimeout(() => confettiLayer.replaceChildren(), 2600);
      }

      function openContent() {
        if (contentShown) return;
        contentShown = true;
        intro.hidden = true;
        gameScreen.hidden = true;
        envelopeScreen.hidden = true;
        contentScreen.hidden = false;
        contentScreen.classList.add("is-opening");
        startHearts();
        observeReveals();
        showConfetti();
        requestRouteUpdate();
        requestAnimationFrame(() => {
          contentScreen.classList.remove("is-opening");
          contentScreen.classList.add("is-open");
          titleNode.focus({ preventScroll: true });
          window.scrollTo({ top: 0, behavior: reducedMotion.matches ? "auto" : "smooth" });
          requestRouteUpdate();
        });
      }

      function showEnvelopeOrContent() {
        if (showEnvelope && envelope) {
          gameScreen.hidden = true;
          envelope.mostrar();
        } else {
          openContent();
        }
      }

      function cleanupGame() {
        window.clearTimeout(gameTimer);
        if (gameInstance && typeof gameInstance.destruir === "function") {
          try { gameInstance.destruir(); } catch (_) {}
        }
        gameInstance = null;
        gameStage.replaceChildren();
        document.body.classList.remove("playing");
      }

      function finishGame() {
        if (gameFinished) return;
        gameFinished = true;
        cleanupGame();
        if (window.NucleoEfectos && typeof window.NucleoEfectos.explotar === "function") {
          const color = getComputedStyle(document.documentElement).getPropertyValue("--wine").trim() || "#8b3d52";
          window.NucleoEfectos.explotar(effectsCanvas, color, showEnvelopeOrContent);
        } else {
          showEnvelopeOrContent();
        }
      }

      function skipGame() {
        if (gameFinished) return;
        gameFinished = true;
        cleanupGame();
        showEnvelopeOrContent();
      }

      function loadGame() {
        gameScreen.hidden = false;
        document.body.classList.add("playing");
        gamePrompt.focus({ preventScroll: true });
        gameTimer = window.setTimeout(() => { rescueButton.hidden = false; }, 60000);
        const script = document.createElement("script");
        script.src = "../../plantillas/juegos-interactivos/juegos/" + gameName + ".js";
        script.onload = () => {
          const game = window.JUEGOS && window.JUEGOS[gameName];
          if (!game || typeof game.iniciar !== "function") {
            gameStatus.textContent = "El juego no está disponible. Podés seguir al recorrido.";
            rescueButton.hidden = false;
            return;
          }
          try {
            gameInstance = game.iniciar(gameStage, {}, finishGame, {
              color: getComputedStyle(document.documentElement).getPropertyValue("--wine").trim() || "#8b3d52",
              para: para,
              de: de
            });
          } catch (_) {
            gameStatus.textContent = "No se pudo abrir el juego. Podés seguir al recorrido.";
            rescueButton.hidden = false;
          }
        };
        script.onerror = () => {
          gameStatus.textContent = "No se pudo cargar el juego. Podés seguir al recorrido.";
          rescueButton.hidden = false;
        };
        document.body.appendChild(script);
      }

      function updateMusicLabel() {
        const paused = audio.paused;
        const label = paused ? "Activar música" : "Pausar música";
        musicText.textContent = label;
        musicToggle.setAttribute("aria-label", label);
        musicToggle.setAttribute("aria-pressed", String(!paused));
      }
      function hideMusic() {
        musicReady = false;
        audio.pause();
        musicToggle.hidden = true;
      }
      function playMusic() {
        if (!musicReady) return;
        try {
          const promise = audio.play();
          if (promise && typeof promise.catch === "function") promise.catch((error) => {
            if (error && error.name === "NotAllowedError") {
              musicToggle.hidden = false;
              updateMusicLabel();
            } else hideMusic();
          });
        } catch (_) {
          hideMusic();
        }
      }

      function spawnTapHeart(event) {
        if (reducedMotion.matches) return;
        const heart = document.createElement("span");
        heart.className = "tap-heart";
        heart.textContent = "♡";
        heart.style.left = event.clientX + "px";
        heart.style.top = event.clientY + "px";
        heart.addEventListener("animationend", () => heart.remove(), { once: true });
        tapLayer.appendChild(heart);
      }

      function renderLightbox() {
        document.getElementById("closePhoto").addEventListener("click", closePhoto);
        lightboxImage.addEventListener("click", closePhoto);
        photoDialog.addEventListener("click", (event) => { if (event.target === photoDialog) closePhoto(); });
        photoDialog.addEventListener("close", () => { lightboxImage.removeAttribute("src"); lightboxImage.alt = ""; });
      }

      renderMoments();
      renderLightbox();
      startButton.addEventListener("click", () => {
        if (startHandled) return;
        startHandled = true;
        intro.hidden = true;
        if (musicReady) {
          audio.src = song;
          musicToggle.hidden = false;
          playMusic();
        }
        if (gameName) loadGame();
        else showEnvelopeOrContent();
      });
      rescueButton.addEventListener("click", skipGame);
      musicToggle.addEventListener("click", () => {
        if (!musicReady) return;
        if (audio.paused) playMusic();
        else audio.pause();
        updateMusicLabel();
      });
      audio.addEventListener("play", updateMusicLabel);
      audio.addEventListener("pause", updateMusicLabel);
      audio.addEventListener("error", hideMusic);
      contentScreen.addEventListener("pointerdown", (event) => {
        if (event.target.closest("button,a,dialog,.moment-photo")) return;
        spawnTapHeart(event);
      });
      window.addEventListener("scroll", updateRouteProgress, { passive: true });
      window.addEventListener("resize", requestRouteUpdate);
      window.addEventListener("orientationchange", requestRouteUpdate);
    })();
  </script>
</body>
