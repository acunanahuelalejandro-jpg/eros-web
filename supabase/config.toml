[functions.webhook-mercadopago]
verify_jwt = false

[functions.estado-pedido]
verify_jwt = false

[functions.obtener-pagina]
verify_jwt = false

# Solo el workflow con x-eros-limpieza conoce el secreto de esta función.
[functions.limpiar-vencidos]
